# main ブランチに push すると、テスト → ビルド → GitHub Pages へ公開
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # 共有・同期の接続先（Supabase）。未設定ならローカルだけで動く版になる。
      # 入れるのは公開してよい Project URL と anon キーだけ（service_role キーは絶対に入れない）。
      # 既定は .env.production の値。Secrets を設定した場合はそちらで上書きする（空なら上書きしない）
      - name: Use Supabase secrets if set
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$URL" ]; then echo "VITE_SUPABASE_URL=$URL" >> "$GITHUB_ENV"; fi
          if [ -n "$KEY" ]; then echo "VITE_SUPABASE_ANON_KEY=$KEY" >> "$GITHUB_ENV"; fi
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # データベースの権限（RLS）を実際の PostgreSQL で検証する（公開はブロックしない）
  rls:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo bash scripts/test-rls.sh
